name: CodeQL security analysis

# CodeQL scans Python source for injection paths, auth bypass, tainted data flows.
# Results are uploaded to the GitHub Security tab (repo is public — no GHAS required).
#
# javascript-typescript excluded until frontend/ is scaffolded.
# Re-add language + matrix entry when frontend is created.
#
# Not included in pr-gate.yml — informational only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        with:
          languages: python
          build-mode: none
          queries: security-and-quality
          config: |
            paths-ignore:
              - backend/.venv
              - backend/tests

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        with:
          category: "/language:python"
          upload: true
