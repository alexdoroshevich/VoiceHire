name: CodeQL security analysis

# CodeQL v4 — scans Python + TypeScript for injection paths, auth bypass,
# tainted data flows. Results go to GitHub Security tab (SARIF upload).
# Also scans .github/workflows/ for CI/CD security issues.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan — Monday 03:00 UTC
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          config: |
            paths-ignore:
              - frontend/node_modules
              - backend/.venv
              - "**/*.test.ts"
              - "**/*.spec.ts"
              - backend/tests

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
