name: PR Quality Gate

# Runs on every PR to main.
# ALL jobs must pass before a PR can be merged (enforced by branch protection).
# This is the single required status check to configure in branch protection.

on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR — always want feedback on latest push
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ── Backend: lint + type check + tests ───────────────────────────────────────
  backend-gate:
    name: Backend gate (lint + types + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voicehire
          POSTGRES_PASSWORD: voicehire
          POSTGRES_DB: voicehire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://voicehire:voicehire@localhost:5432/voicehire_test
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-gate-secret-not-for-production
      APP_ENV: test

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --desc on --skip-editable

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app/ || true  # not strict yet

      - name: Unit tests
        run: |
          pytest -x -q \
            -m "not integration" \
            --cov=app \
            --cov-report=term-missing

      - name: Backend summary
        if: always()
        run: |
          echo "## Backend Gate" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "Lint, types, and unit tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "One or more checks failed" >> $GITHUB_STEP_SUMMARY
          fi

  # ── Frontend: lint + type check + unit tests ─────────────────────────────────
  frontend-gate:
    name: Frontend gate (lint + types + tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check if frontend exists
        id: check-frontend
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Frontend not yet created — skipping" >> $GITHUB_STEP_SUMMARY
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.check-frontend.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm install

      - name: Lint (eslint)
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Type check (tsc)
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run type-check

      - name: Unit tests (vitest)
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm test

  # ── Pre-commit hooks (file hygiene + secrets detection) ──────────────────────
  pre-commit-gate:
    name: Pre-commit hooks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  # ── PR metadata check ────────────────────────────────────────────────────────
  pr-metadata:
    name: PR description check
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    steps:
      - name: Check PR has description
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const body = context.payload.pull_request.body || "";

            if (body.trim().length < 200) {
              core.setFailed(
                "PR description is too short (under 200 chars). Fill in the pull request template."
              );
              return;
            }

            if (!body.includes("## What does this PR do?")) {
              core.setFailed("Missing section '## What does this PR do?' in PR description.");
              return;
            }
            if (!body.includes("## How to test")) {
              core.setFailed("Missing section '## How to test' in PR description.");
              return;
            }

            const unfilled = [
              "<!-- One paragraph summary: what changed and why -->",
              "<!-- Steps for the reviewer to verify the change works -->",
            ];
            for (const placeholder of unfilled) {
              if (body.includes(placeholder)) {
                core.setFailed(
                  `PR description still has an unfilled placeholder: "${placeholder}". ` +
                  "Replace it with actual content."
                );
                return;
              }
            }

  # ── Summary gate: all must pass ──────────────────────────────────────────────
  all-gates-passed:
    name: All gates passed
    runs-on: ubuntu-latest
    needs: [backend-gate, frontend-gate, pre-commit-gate, pr-metadata]
    if: always()

    steps:
      - name: Check all gates
        run: |
          if [[ "${{ needs.backend-gate.result }}" != "success" ]]; then
            echo "Backend gate failed"; exit 1
          fi
          if [[ "${{ needs.frontend-gate.result }}" != "success" ]]; then
            echo "Frontend gate failed"; exit 1
          fi
          if [[ "${{ needs.pre-commit-gate.result }}" != "success" ]]; then
            echo "Pre-commit gate failed"; exit 1
          fi
          if [[ "${{ needs.pr-metadata.result }}" != "success" ]]; then
            echo "PR metadata check failed"; exit 1
          fi
          echo "All gates passed — PR is ready to merge"

      - name: Gate summary
        if: always()
        run: |
          echo "## PR Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.backend-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.frontend-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-commit | ${{ needs.pre-commit-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PR Metadata | ${{ needs.pr-metadata.result }} |" >> $GITHUB_STEP_SUMMARY
