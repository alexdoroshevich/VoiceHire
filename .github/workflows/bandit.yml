name: Security scan (bandit)

# Bandit scans Python source for common security issues (OWASP).
# Runs on every PR that touches backend code.
# Medium severity + medium confidence = fail the build.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths:
      - backend/**

jobs:
  bandit:
    name: Python security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: PyCQA/bandit-action@67a458d90fa11fb1463e91e7f4c8f068b5863c7f # v1.0.1
        with:
          targets: backend/app
          severity: medium
          confidence: medium
          exclude: backend/tests
