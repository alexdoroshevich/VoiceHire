name: Deploy

# Triggers:
#   push to main  → production deploy
#   workflow_dispatch → manual deploy from GitHub UI
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — validate without deploying"
        required: false
        type: boolean
        default: false

# Prevent simultaneous deploys
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Run tests before deploy ───────────────────────────────────────────────────
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voicehire
          POSTGRES_PASSWORD: voicehire
          POSTGRES_DB: voicehire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://voicehire:voicehire@localhost:5432/voicehire_test
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: test-secret-key-not-for-production
      APP_ENV: test

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -x -q -m "not integration" --cov=app --cov-report=term-missing

      - name: Test summary
        if: always()
        run: |
          echo "## Backend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "- Status: All checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Status: One or more checks failed" >> $GITHUB_STEP_SUMMARY
          fi

  # ── Deploy to production ──────────────────────────────────────────────────────
  deploy:
    name: Deploy backend
    needs: test
    runs-on: ubuntu-latest
    if: github.event.inputs.dry_run != 'true'

    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Deploy backend
        run: cd backend && flyctl deploy --config fly.toml --app ${{ secrets.FLY_APP_NAME }} --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy summary
        if: always()
        run: |
          echo "## Deploy Results" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "- Status: Deployed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Status: Deployment failed" >> $GITHUB_STEP_SUMMARY
          fi
